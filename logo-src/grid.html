<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:3240px;height:3240px}
  #grid{display:grid;grid-template-columns:repeat(3,1080px);grid-template-rows:repeat(3,1080px)}
  .tile{width:1080px;height:1080px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;text-align:center}
  .deep{background:radial-gradient(circle at 50% 42%,#8bab9d,#647f73)}
  .deep2{background:linear-gradient(150deg,#7c9d90,#5f8073)}
  .light{background:#eef4f0}
  .cream{background:#efe9dc}
  .accent{background:linear-gradient(150deg,#b6604a,#9c4e3a)}
  .mincho{font-family:'Hiragino Mincho ProN','YuMincho','Yu Mincho',serif}
  .sans{font-family:'Hiragino Sans','Helvetica Neue',sans-serif}
  .cInk{color:#33473f} .cCream{color:#f5f0e3} .cDeep{color:#3a5b4e}
  .ring{position:absolute;inset:72px;border:2px solid rgba(244,239,226,.35);border-radius:50%}
  .logoK{font-size:600px;font-weight:600;line-height:1;color:#f5f0e3;text-shadow:0 8px 34px rgba(0,0,0,.14)}
  .big{font-size:118px;font-weight:600;line-height:1.6;letter-spacing:.08em}
  .huge{font-size:150px;font-weight:600;line-height:1.4;letter-spacing:.1em}
  .en{font-size:40px;letter-spacing:.5em;font-weight:300}
  .sub{font-size:46px;letter-spacing:.14em;margin-top:26px;font-weight:400}
  .label .name{font-size:70px;font-weight:600;letter-spacing:.08em}
  .label .price{font-size:50px;margin-top:12px;letter-spacing:.06em}
  .vwrap{width:660px;height:660px;margin-bottom:20px}
  .vwrap svg{width:100%;height:100%;display:block}
  .col{display:flex;flex-direction:column;align-items:center;justify-content:center}
  .divider{width:56px;height:2px;background:currentColor;opacity:.5;margin:30px auto}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="cel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbe3d8"/><stop offset="1" stop-color="#93b8a9"/></linearGradient>
  <linearGradient id="celDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a7c8ba"/><stop offset="1" stop-color="#84a597"/></linearGradient>
</defs></svg>
<div id="grid"></div>

<script>
function vessel(type){
  var shadow='<ellipse cx="200" cy="360" rx="112" ry="18" fill="#3a5b4e" opacity=".08"/>';
  var v='';
  if(type==='bowl'){v=shadow+'<path d="M96,250 Q200,470 304,250 Q200,300 96,250 Z" fill="url(#cel)"/><ellipse cx="200" cy="250" rx="104" ry="30" fill="url(#celDark)"/><ellipse cx="200" cy="251" rx="88" ry="23" fill="#eaf4ef"/><ellipse cx="200" cy="253" rx="70" ry="16" fill="#d3e6dd"/>';}
  if(type==='mug'){v=shadow+'<path d="M262,238 q66,-6 62,54 q-4,58 -66,50 l0,-24 q36,4 40,-28 q2,-30 -36,-28 Z" fill="url(#celDark)"/><path d="M146,214 L136,352 Q200,372 264,352 L254,214 Z" fill="url(#cel)"/><ellipse cx="200" cy="214" rx="59" ry="17" fill="url(#celDark)"/><ellipse cx="200" cy="215" rx="47" ry="12" fill="#eaf4ef"/>';}
  if(type==='plate'){v=shadow+'<ellipse cx="200" cy="286" rx="118" ry="34" fill="url(#cel)"/><ellipse cx="200" cy="278" rx="118" ry="34" fill="url(#celDark)"/><ellipse cx="200" cy="276" rx="98" ry="27" fill="#eaf4ef"/><ellipse cx="200" cy="275" rx="66" ry="17" fill="#d3e6dd"/>';}
  return '<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">'+v+'</svg>';
}

var tiles=[
  // 1 ブランドマーク
  {cls:'deep', html:'<div class="ring"></div><div class="mincho logoK">暁</div>'},
  // 2 コンセプト
  {cls:'deep2', html:'<div class="mincho cCream big">名もない一日を、<br>少しだけ豊かに。</div>'},
  // 3 手仕事
  {cls:'light', html:'<div class="mincho cInk huge">ひとつずつ、<br>手で。</div>'},
  // 4 飯碗
  {cls:'light', html:'<div class="col"><div class="vwrap">'+vessel('bowl')+'</div><div class="label mincho cDeep"><div class="name">粉引 飯碗</div><div class="price">¥3,200</div></div></div>'},
  // 5 名の由来
  {cls:'deep', html:'<div class="mincho cCream"><div class="huge" style="font-size:150px">暁星</div><div class="divider"></div><div class="sub">明けの明星より</div></div>'},
  // 6 マグ
  {cls:'light', html:'<div class="col"><div class="vwrap">'+vessel('mug')+'</div><div class="label mincho cDeep"><div class="name">青磁 マグ</div><div class="price">¥3,600</div></div></div>'},
  // 7 小皿
  {cls:'light', html:'<div class="col"><div class="vwrap">'+vessel('plate')+'</div><div class="label mincho cDeep"><div class="name">刷毛目 小皿</div><div class="price">¥1,800</div></div></div>'},
  // 8 青磁
  {cls:'deep2', html:'<div class="mincho cCream"><div class="huge">青磁の器</div><div class="sub" style="opacity:.85">使うほど、味わいを増す</div></div>'},
  // 9 お知らせ
  {cls:'accent', html:'<div class="mincho cCream"><div class="sub" style="margin:0 0 26px;opacity:.85">GYOSEI</div><div class="big" style="font-size:132px">近日、<br>オンラインにて<br>販売します</div></div>'},
];

var g=document.getElementById('grid');
tiles.forEach(function(t){
  var d=document.createElement('div');
  d.className='tile '+t.cls;
  d.innerHTML=t.html;
  g.appendChild(d);
});
</script>
</body></html>
